name: Build Market Moves+
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.py'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile site
        run: |
          python build.py 1.0.86
      - name: JavaScript syntax check
        run: |
          node --check src/script.js
          node --check src/mining.js
          node --check src/refine.js
          node --check src/mining_data.js
      - name: Verify bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'const NULL_MARKETS=' in s
          assert 'Los precios de Null se estiman' in s
          assert '__REFINE__' not in s and '__MINING__' not in s
          assert len(s)>100000
          print('Generated site validation OK')
          PY
      - name: Commit generated site
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build: regenerate Market Moves+ v1.0.86"
            git push
          fi
