name: Rebuild Market Moves distributable
on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/rebuild-market-moves.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-moves-build-main
  cancel-in-progress: true

jobs:
  compile:
    if: github.ref == 'refs/heads/main'
    outputs:
      publishable: ${{ steps.publish_site.outputs.published }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Source assembly and JavaScript syntax tests
        id: source_checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Finance math regression tests
        id: finance_checks
        run: node --test tests/*.test.cjs
      - name: Build single-file app
        id: build_site
        run: |
          python3 build.py 1.0.164
          test -s index.html
          grep -q 'EVE7 theme ownership' index.html
          grep -q 'Login' index.html
          grep -q 'v1.0.164' index.html
          grep -Fq 'B.21 v1.0.158' index.html
          grep -Fq 'id="pkOverviewToggle" aria-controls="pkOverviewContent"' index.html
          grep -Fq 'id="pkInsightsToggle" aria-controls="pkInsightsContent"' index.html
          grep -Fq 'class="mm-step-drawer" id="stepDrawer"' index.html
          grep -Fq 'id="stepDrawerTotal"' index.html
          grep -Fq 'class="mm-extra-drawer-body"' index.html
          grep -Fq 'class="hero-referral-offer" data-i18n="referral.freeSp">1,000,000 SP GRATIS</span>' index.html
          ! grep -Fq 'class="tk-track"' index.html
          ! grep -q '/\\*__STYLE_SOURCES__\\*/' index.html
      - name: Legacy EVE market, mining and skills regressions on assembled sources
        id: domain_checks
        run: |
          node tests/mining-smoke.cjs
          node tests/mining-types.cjs
          node tests/ice-settings.cjs
          node tests/mining-price-flow.cjs
          node tests/trading-unit-prices.cjs
          node tests/market-scenarios.cjs
          node tests/financial-accounting.cjs
          node tests/skills-integration.cjs
      # Browser binaries are expensive to download on each short source commit.
      # Cache downloads without skipping the OS libraries required by fresh runners.
      - name: Restore cached Chromium and pip wheels
        id: browser_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/pip
          key: ${{ runner.os }}-playwright-1.56.0-browser-v1
      - name: Install headless Chromium for theme smoke tests
        id: install_browser
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          if [ "${{ steps.browser_cache.outputs.cache-hit }}" = "true" ]; then
            python3 -m playwright install-deps chromium
            python3 -m playwright install chromium
          else
            python3 -m playwright install chromium --with-deps
          fi
      - name: Validate Light/Dark and EVE login translations in Chromium
        id: browser_checks
        run: python3 -m unittest discover -s tests -p 'browser_*.py' -v
      - name: Upload Light/Dark responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-regression-${{ github.run_id }}
          path: tests/artifacts/theme/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Record verification evidence
        run: |
          cat > docs/QA_STATUS.md <<EOF
          # Market Moves+ — last verified CI build

          - Source commit: \`${GITHUB_SHA}\`
          - Workflow run: \`${GITHUB_RUN_ID}\`
          - Version: \`1.0.164\`
          - Verified before publication: Python source assembly, Node syntax, SIGMA Freight formula regression, build, Chromium Light/Dark contrast and Login/Iniciar sesión checks.
          - Limitation: automated headless checks do not replace human visual review of every view or live ESI/SSO.
          EOF
      - name: Publish generated index
        id: publish_site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/QA_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Market Moves+ 1.0.164 from modular sources"
            # Other documentation / source commits may land while Chromium runs.
            # Rebase our tested artifact instead of overwriting or force pushing.
            for attempt in 1 2 3 4; do
              git fetch origin main
              # Never publish an artifact compiled from obsolete sources. A
              # previous workflow may still be running when a new one starts.
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "Remote history changed; refusing to publish unverified artifact."
                exit 1
              fi
              if ! git diff --quiet "$GITHUB_SHA" origin/main -- build.py src tests .github/workflows/rebuild-market-moves.yml; then
                echo "Newer source or tests detected: skip stale build; the new push has its own CI run."
                exit 0
              fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Newer conflicting index.html was published; keep remote intact."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "published=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 2
            done
            echo "Unable to publish after four non-destructive retries."
            exit 1
          else
            # The verified artifact already matches the repository.
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage verified site for Pages
        if: steps.publish_site.outputs.published == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          grep -q 'v1.0.164' _site/index.html
      - name: Upload verified GitHub Pages artifact
        if: steps.publish_site.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # This does not bypass QA; it records which gate rejected publication.
      # Documentation-only commits do not trigger this rebuild workflow.
      - name: Record failed build gate
        if: failure()
        env:
          CHECKS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          data=json.loads(os.environ.get('CHECKS','{}'))
          failed=[f"{key}: {item.get('outcome', 'unknown')}" for key,item in data.items()
                  if item.get('outcome') in ('failure','cancelled')]
          body="# Market Moves+ — CI publication blocked\\n\\n"
          body+=f"- Source: \`{os.environ['GITHUB_SHA']}\`\\n"
          body+=f"- Run: \`{os.environ['GITHUB_RUN_ID']}\`\\n"
          body+="- Expected version: \`1.0.164\`\\n"
          body+="- Failed gates: "+(', '.join(failed) or 'unknown (check GitHub Actions logs)')+"\\n"
          body+="\\nPublication was stopped. See the workflow run for error details.\\n"
          pathlib.Path('docs/CI_FAILURE.md').write_text(body,encoding='utf-8')
          print(body)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_FAILURE.md
          if ! git diff --cached --quiet; then
            git commit -m "ci: record failed v1.0.164 publication gate"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 0; }
            git push origin HEAD:main || true
          fi

  deploy:
    name: Deploy verified Market Moves+ to GitHub Pages
    needs: compile
    if: needs.compile.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages_deployment.outputs.page_url }}
    steps:
      - name: Publish verified Pages artifact
        id: pages_deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public site serves the static SP banner
        env:
          PAGES_URL: ${{ steps.pages_deployment.outputs.page_url }}
        run: |
          test -n "$PAGES_URL"
          for attempt in $(seq 1 15); do
            if pages_html=$(curl -fLsS --connect-timeout 10 --max-time 20 "${PAGES_URL}?verified=${GITHUB_RUN_ID}") && \
               grep -Fq 'class="hero-referral-offer" data-i18n="referral.freeSp">1,000,000 SP GRATIS</span>' <<< "$pages_html" && \
               grep -Fq 'v1.0.164' <<< "$pages_html" && \
               grep -Fq 'class="mm-step-drawer" id="stepDrawer"' <<< "$pages_html"; then
              echo "Public GitHub Pages confirms B.21 compact Discord steps and fixed destination language v1.0.164 at $PAGES_URL"
              exit 0
            fi
            echo "Waiting for Pages CDN to serve v1.0.164 (attempt $attempt of 15)"
            sleep 6
          done
          echo "Pages deployment did not serve the validated static SP banner."
          exit 1
