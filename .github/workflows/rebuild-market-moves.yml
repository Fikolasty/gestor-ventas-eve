name: Rebuild Market Moves distributable
on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/rebuild-market-moves.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-moves-build-main
  cancel-in-progress: false

jobs:
  compile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Source assembly and JavaScript syntax tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Finance math regression tests
        run: node --test tests/*.test.cjs
      - name: Build single-file app
        run: |
          python3 build.py 1.0.114
          test -s index.html
          grep -q 'EVE7 theme ownership' index.html
          grep -q 'Login' index.html
          grep -q 'v1.0.114' index.html
          ! grep -q '/\\*__STYLE_SOURCES__\\*/' index.html
      - name: Install headless Chromium for theme smoke tests
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install chromium --with-deps
      - name: Validate Light/Dark and EVE login translations in Chromium
        run: python3 -m unittest discover -s tests -p 'browser_*.py' -v
      - name: Publish generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Market Moves+ 1.0.114 from modular sources"
            git push
          fi
