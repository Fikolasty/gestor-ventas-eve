# Crea automáticamente un tag y un Release por cada versión.
# Busca los commits cuyo mensaje empieza con "v1.2.3 — título" y, si ese tag aún no existe,
# crea el tag y el Release con el index.html de ese commit para descargar
# (renombrado gestor-ventas-v1.2.3.html) y las notas de esa versión sacadas del CHANGELOG.
name: Versiones
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: versiones
  cancel-in-progress: false
jobs:
  releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ChatGPT: tag recuperable para cada commit marcado, sin tocar versiones normales.
      - name: Etiquetar commits ChatGPT para recuperacion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags
          git log --format='%H %s' main | while read -r sha subject; do
            case "$subject" in
              *'[ChatGPT]'*) ;;
              *) continue ;;
            esac
            tag="chatgpt-${sha:0:12}"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1; then
              continue
            fi
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$sha" >/dev/null
            echo "Creado $tag"
          done
      - name: Crear tags y Releases que falten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch --tags
          git log --reverse --format='%H %s' main | while read -r sha subject; do
            ver=$(echo "$subject" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' || true)
            [ -z "$ver" ] && continue
            if git rev-parse -q --verify "refs/tags/$ver" >/dev/null; then continue; fi
            title=$(echo "$subject" | sed -E 's/^v[0-9.]+ — //')
            n=${ver#v}
            # notas: la sección "## n — ..." del CHANGELOG de ese commit
            git show "$sha:CHANGELOG.md" | awk -v v="$n" '
              $0 ~ "^## "v" " {on=1; next}
              on && /^## / {exit}
              on {print}' > notes.md
            git show "$sha:index.html" > "gestor-ventas-$ver.html"
            gh release create "$ver" "gestor-ventas-$ver.html" \
              --target "$sha" --title "$ver — $title" --notes-file notes.md
            echo "Creado $ver"
          done
          # Versiones subidas por la web como «Publicar vX.Y.Z: …» o «Publicar vA.B.C - vX.Y.Z: …»
          # (varios commits por versión): tag en el ÚLTIMO commit de cada una, notas de todas las secciones
          # del rango en el CHANGELOG, y sin marcarla como Latest (son versiones viejas).
          git log --format='%H %s' main | while read -r sha subject; do
            rng=$(echo "$subject" | sed -nE 's/^Publicar (v[0-9]+\.[0-9]+\.[0-9]+)( - (v[0-9]+\.[0-9]+\.[0-9]+))?[: ].*/\1 \3/p')
            [ -z "$rng" ] && continue
            lo=$(echo $rng | cut -d' ' -f1); ver=$(echo $rng | cut -s -d' ' -f2); [ -z "$ver" ] && ver=$lo
            if git rev-parse -q --verify "refs/tags/$ver" >/dev/null; then continue; fi
            n=${ver#v}; l=${lo#v}
            git show "$sha:CHANGELOG.md" | awk -v lo="$l" -v hi="$n" '
              function num(v,  a){split(v,a,".");return a[1]*1000000+a[2]*1000+a[3]}
              /^## [0-9]+\.[0-9]+\.[0-9]+ / {on=(num($2)>=num(lo)&&num($2)<=num(hi))}
              on {print}' > notes.md
            title=$(git show "$sha:CHANGELOG.md" | grep -m1 "^## $n — " | sed "s/^## $n — //")
            git show "$sha:index.html" > "gestor-ventas-$ver.html"
            gh release create "$ver" "gestor-ventas-$ver.html" \
              --target "$sha" --title "$ver — $title" --notes-file notes.md --latest=false
            git tag "$ver" "$sha"
            echo "Creado $ver (subida web)"
          done
