/* Skills v2: identical main-column hierarchy and dark theme, no side navigation. */
:root{--panel:#201e1d;--surface:#252321;--border:#46403b}
.wrap{max-width:1330px;padding:29px 28px 75px}
.heading{margin-bottom:22px}.heading h1{font-size:38px}.heading p{max-width:760px}

.category-strip .tabs{display:flex;gap:7px;flex:1;min-width:0;flex-wrap:wrap}
.category-strip .tab{margin:0;width:auto;padding:10px 17px;gap:10px;white-space:nowrap}
.category-strip .tab svg{height:18px;width:18px}
.category-strip .tools{display:flex;align-items:center;gap:9px}
.category-strip .lang-btn,.category-strip .tiny-btn{background:#282522;border:1px solid #4b423b;color:#d8c6b9;font-weight:750;border-radius:8px;font-size:12px;padding:10px 12px}
.category-strip .lang-btn.active{background:#513224;border-color:#905b3d;color:#fbe2d3}
.main{min-width:0;padding:25px 28px}
.category-head{padding-bottom:20px}.category-head h2{font-size:20px;letter-spacing:.055em}
.category-head .count{border:1px solid #5b4a41;padding:6px 9px;border-radius:6px}
.steps{gap:14px}.steps>details{border-radius:12px}.steps>details[open]{border-color:#986146}
.steps>details>summary{min-height:77px;grid-template-columns:43px minmax(0,1fr) auto 20px}
.content{padding:19px 20px 21px}.content>p{margin-top:0}
.stack-title{font-size:11.5px;font-weight:850;letter-spacing:.12em;color:#df9c79;margin:0 0 11px;display:flex;align-items:center;gap:9px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{min-height:72px}.stat.highlight{border-color:#956347;background:#332721;box-shadow:inset 0 0 0 1px #81513950}
.content-grid{grid-template-columns:minmax(0,1.09fr) minmax(275px,.91fr);margin-top:12px}
.notes{padding:17px 18px}.notes ul{margin-bottom:8px}
.copybox{overflow:hidden}.copybox .skills-text{max-height:320px}.copybox .copy-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.plan-name-row{padding:12px 15px;border-bottom:1px solid #39312e;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;color:#a7a09a;font-size:11.5px}
.plan-name-row strong{display:block;font-size:13px;color:#e8cfbd;margin-bottom:5px}
.books-panel{margin-top:17px;border:1px solid #4a403a;border-radius:11px;background:#1d1b1a;padding:16px}
.books-panel .book-intro{display:flex;align-items:center;justify-content:space-between;gap:13px;margin-bottom:13px;flex-wrap:wrap}
.books-panel .book-intro p{font-size:11.5px;color:#a69d95;margin:2px 0;max-width:670px;line-height:1.5}
.book-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.book-card{min-width:0;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:9px;background:#292523;border:1px solid #4b413a;border-radius:9px;padding:9px}
.book-card img,.skill-mini{image-rendering:auto;height:33px;width:33px;object-fit:contain;background:#171616;border:1px solid #4c3d36;border-radius:6px;padding:3px}
.book-card .book-name{font-size:11.5px;font-weight:750;line-height:1.3;color:#e7d8ce;overflow-wrap:anywhere}
.book-card .book-price{display:block;margin-top:4px;color:#91d1ad;font-size:11.5px;font-weight:700;letter-spacing:.01em}
.book-card .book-sub{display:block;color:#938a81;font-size:11.5px;margin-top:2px}
.detail-panel{margin-top:17px}.skill-list{border:1px solid #4b413a;border-radius:10px;overflow:hidden;background:#1d1c1b}
.skill-row{border:0;border-bottom:1px solid #3d3732;border-radius:0;background:none}.skill-row:last-child{border-bottom:0}.skill-row[open]{background:#272321;border-color:#76513e}
.skill-row>summary{padding:12px 15px;display:grid;grid-template-columns:35px minmax(0,1fr) auto 13px;align-items:center;gap:10px}
.skill-row .skill-label{min-width:0}.skill-row .skill-label b{display:block;font-size:13px}.skill-row .skill-label small{font-size:11.5px;display:block;margin-top:4px;color:#a9a19c}
.skill-row .level{background:#3a2d28;color:#edb38c;border:1px solid #604536;border-radius:6px;padding:5px 8px;font-size:11.5px;font-weight:800;white-space:nowrap}
.skill-row .trained{background:#294535;color:#9fddb8;border-color:#426d55}
.skill-description{padding:0 16px 15px 60px;color:#c4b9b0;font-size:12px;line-height:1.7}
.skill-description p{margin:7px 0 10px}.skill-facts{display:flex;gap:8px;flex-wrap:wrap}.skill-facts span{border:1px solid #5c4c41;color:#c6aba0;border-radius:5px;font-size:11.5px;padding:5px 8px}
.skill-advise{border-left:2px solid #c27a56;padding:8px 11px;background:#342823;margin-top:10px}
.content .stat .value{font-variant-numeric:tabular-nums}.muted{color:#a99e93}.omega-note{color:#f0b391}
.connection{margin-bottom:17px;padding:16px 19px}.connection button{background:#a45e3d}
.model-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 15px;margin:10px 0 12px;border:1px solid #4a4038;border-radius:10px;background:#262220;flex-wrap:wrap}
.model-bar .model-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.model-bar .model-left small{font-size:11.5px;color:#afa59e}
.model-bar select{background:#171716;color:#efe1d5;border:1px solid #5d4a41;border-radius:7px;padding:8px 12px;font-size:12px}
.model-bar .pill{font-size:11.5px}.model-bar .legend{color:#ad9e91;font-size:11.5px}
.remap-detail{display:block;font-size:11.5px;line-height:1.5;color:#ad9a8c;margin-top:4px}
.statusline{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:#a69b90}
.statusline .dot{height:7px;width:7px;border-radius:50%;background:#d0966d;display:inline-block}
.source-links{font-size:11.5px;line-height:1.65;color:#998f85;margin-top:18px}
.source-links a{color:#b8a398}
.copy:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:1050px){.book-items{grid-template-columns:repeat(2,minmax(0,1fr))}.content-grid{grid-template-columns:1fr}}
@media(max-width:750px){.wrap{padding:20px 12px 65px}.category-strip{flex-wrap:wrap}.category-strip .tools{margin-left:auto}.main{padding:15px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.book-items{grid-template-columns:1fr}.heading h1{font-size:32px}.category-head .count{display:none}}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.step-meta{display:none}.steps>details>summary{grid-template-columns:35px minmax(0,1fr) 13px}.num{height:35px}.content{padding:15px 12px}.skill-row>summary{padding:11px 9px;gap:7px}.skill-description{padding-left:16px}.model-bar{align-items:flex-start}}

/* Preview: simulation in the same category subheader; language remains a global Setting. */
.category-strip .tools{margin-left:auto;flex:0 0 auto}
.category-strip .sim-toggle{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  white-space:nowrap;min-height:40px;padding:7px 13px;color:#e9dfd5;background:#302b27;
  border:1px solid #655347;border-radius:10px;font-weight:700;font-size:12px}
.category-strip .sim-toggle:hover{border-color:#a9785e;background:#37302a}
.sim-switch-track{width:35px;height:20px;border-radius:99px;background:#554b44;border:1px solid #817365;
  display:block;position:relative;flex:none;transition:background .17s}
.sim-switch-thumb{position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;
  background:#f0e5da;box-shadow:0 1px 3px #0007;transition:transform .17s}
.sim-toggle[aria-checked="true"]{background:#2e4035;border-color:#5c886d;color:#d7f4df}
.sim-toggle[aria-checked="true"] .sim-switch-track{background:#43815c;border-color:#67a47c}
.sim-toggle[aria-checked="true"] .sim-switch-thumb{transform:translateX(15px)}
.connection{grid-template-columns:36px minmax(0,1fr) auto;gap:14px}
.connection-icon{font-size:22px;color:#e4a984;height:35px;width:35px;display:grid;place-items:center;
  border:1px solid #745744;border-radius:9px;background:#392820}
.connection.demo .connection-icon{color:#a5dab7;border-color:#55765c;background:#293a2f}
.connection-status{font-size:11.5px;font-weight:850;letter-spacing:.09em;color:#c9ac93;
  border:1px solid #695345;padding:7px 10px;border-radius:6px;white-space:nowrap}
.connection.demo .connection-status{color:#a0dbb7;border-color:#508066}
@media(max-width:760px){.category-strip .tools{width:100%;margin-left:0}.category-strip .sim-toggle{width:100%}}
@media(max-width:650px){.connection{grid-template-columns:32px minmax(0,1fr)}.connection-status{grid-column:2;justify-self:start}}

/* A book already injected into the pilot is not a new purchase. */
.book-card.book-owned .book-price{color:var(--green)}
.book-card.book-owned{border-color:rgba(129,199,160,.3)}

/* Accessible minimum typography for Skills (no micro-text under 11.5 px).
   Completed training is a clear success state, not just a stage number. */
.plan.is-complete{border-color:rgba(109,190,145,.55)!important}
.plan.is-complete>summary{background:linear-gradient(90deg,rgba(62,108,78,.22),transparent 70%)}
.plan.is-complete>summary .step-heading>strong{color:#c8f1d6}
.plan.is-complete>summary .step-heading>small{color:#9edbb5;font-weight:600}
.plan.is-complete>summary .num{background:#2d513e;color:#d0f6dd}
.plan>summary .step-meta .pill.done{display:inline-flex!important;align-items:center;justify-content:center;white-space:nowrap;gap:5px;line-height:1.3;font-size:11.5px}
.plan.is-complete>summary .step-meta .pill.done{background:rgba(54,112,72,.28);border-color:#52946e;color:#c4f0d1}
@media(max-width:670px){.plan>summary .step-meta .pill.done{font-size:11.5px;white-space:normal;text-align:center;max-width:140px}}


/* Connected pilot is automatically personalized; demonstration cannot override real skills. */
.sim-toggle:disabled{cursor:default;opacity:1;background:#294033;border-color:#6ba17e;color:#ddf7e5}
.sim-toggle:disabled:hover{background:#294033;border-color:#6ba17e}


/* All embedded visuals inherit the live Market Moves+ design tokens.
   These are populated by the sandbox bridge; fallbacks only support standalone preview. */
:root{
  --mm-txt:#faf9f5;--mm-mut:#c2c0b6;--mm-dim:#9c9a92;
  --mm-line:rgba(222,220,209,.12);--mm-line2:rgba(222,220,209,.14);
  --mm-clay:#d97757;--mm-ion:#d6d4cb;--mm-gain:#5cba86;--mm-loss:#e8746c;
  --mm-surface-card:rgba(21,21,21,.9);--mm-surface-panel:rgba(30,30,29,.96);
  --mm-r-sm:8px;--mm-r-md:12px;--mm-r-lg:18px;
  --mm-font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mm-size:16px;
  --ink:var(--mm-txt);--muted:var(--mm-mut);--line:var(--mm-line);
  --panel:var(--mm-surface-panel);--card:var(--mm-surface-card);
  --accent:var(--mm-clay);--green:var(--mm-gain);
  font-family:var(--mm-font);font-size:var(--mm-size);color:var(--mm-txt);
}
html.mm-light{color-scheme:light}
html:not(.mm-light){color-scheme:dark}
body{background:transparent!important;color:var(--mm-txt)!important;font-family:var(--mm-font)!important;font-size:var(--mm-size)!important;line-height:1.55}
.wrap{max-width:none!important;padding:0 3px 24px!important}
.eyebrow,.heading h1,.category-strip .strip-home{display:none!important}
.heading{align-items:center;margin:0 0 15px!important;gap:14px}
.heading p{color:var(--mm-mut)!important;font:400 .88rem/1.5 var(--mm-font)!important;max-width:76ch}
.badge,.category-head .count{border-color:var(--mm-line)!important;color:var(--mm-mut)!important;background:transparent!important}
.category-strip,.main,.connection,.model-bar,.books-panel,.detail-panel,.copybox,.notes,.stat,.book-card,.skill-list{
  box-shadow:none!important;border-radius:var(--mm-r-md)!important;
  border-color:var(--mm-line)!important;
}
.category-strip,.model-bar,.connection,.main,.books-panel,.skill-list,.copybox,.notes{
  background:var(--mm-surface-panel)!important;color:var(--mm-txt)!important;
}
.main{padding:20px!important}
.category-strip{padding:7px!important;gap:8px}
.category-strip .tabs{gap:6px}
.category-strip .tab{border-radius:var(--mm-r-sm);font:650 .82rem/1.35 var(--mm-font);color:var(--mm-mut)!important}
.category-strip .tab.active{background:color-mix(in srgb,var(--mm-clay) 14%,transparent)!important;border-color:color-mix(in srgb,var(--mm-clay) 38%,transparent)!important;color:var(--mm-txt)!important}

.sim-toggle,.model-bar select,.copy,.category-strip .tiny-btn,.category-strip .lang-btn{
  font-family:var(--mm-font)!important;border-radius:var(--mm-r-sm)!important
}
.model-bar select{background:var(--mm-surface-card)!important;color:var(--mm-txt)!important;border-color:var(--mm-line)!important}
.connection,.model-bar,.stat,.book-card,.step-heading,.notes,.copybox,.books-panel{
  color:var(--mm-txt)!important;
}

function bookCard(sk){const m=catalog.get(sk.name);const b=document.createElement('div');b.className='book-card';const img=document.createElement('img');img.src=icon(m?.id);img.alt=sk.name;img.loading='lazy';imageBackup(img);const info=document.createElement('div');const name=document.createElement('span');name.className='book-name';name.textContent=sk.name;const price=document.createElement('span');price.className='book-price';const quote=quotes.get(sk.name);const base=m?.referencePrice;const owned=demo&&(demoSkills[sk.name]||0)>0;price.textContent=owned?money(0):Number.isFinite(quote)?money(quote):Number.isFinite(base)?'≈ '+money(base):apiState==='loading'?T('loading'):T('noQuote');const sub=document.createElement('span');sub.className='book-sub';sub.textContent=owned?T('alreadyLearned'):Number.isFinite(quote)?T('market'):Number.isFinite(m?.referencePrice)?T('referencePrice'):T('pendingQuote');if(owned)b.classList.add('book-owned');info.append(name,price,sub);b.append(img,info);return b;}
function buildStats(p,skills,remaining,clone){const q=planQuote(demo?skills.filter(x=>!(demoSkills[x.name]>0)):skills);const d=durationState(remaining);const stats=document.createElement('div');stats.className='stats';const opts=[[T('clone'),clone],[T('books'),quotedStat(q)],[T('duration'),d.total!==null?formatDuration(d.total):'—'],[T('optDuration'),d.remap?formatDuration(d.remap.mins):'—']];for(let i=0;i<opts.length;i++){let x=document.createElement('div');x.className='stat'+((i===2&&activeProfile==='balanced')||(i===3&&activeProfile==='remap')?' highlight':'');let cap=document.createElement('small');cap.textContent=opts[i][0];let val=document.createElement('strong');val.className='value'+(i===1?' green':'');val.textContent=opts[i][1];x.append(cap,val);if(i===3){let extra=document.createElement('span');extra.className='remap-detail';extra.textContent=suggestedText(d.remap);x.append(extra);}stats.append(x);}return stats;}
function renderPlan(p,i,type){const s=planState(p),personalized=demo||(typeof pilotConnected==='boolean'&&pilotConnected),completed=personalized&&s.all.length>0&&s.done===s.all.length,texts=(lang==='es'?planTranslation:planEnglish)[type][i],clone=type==='pi'?T('omega'):p.clone==='Omega*'?(lang==='es'?'Omega · variante Alpha':'Omega · Alpha variant'):T('omega');const d=document.createElement('details');d.className='plan';if(completed)d.classList.add('is-complete');const sum=document.createElement('summary');const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const label=document.createElement('span');label.className='step-heading';const strong=document.createElement('strong');strong.textContent=titles[type][i][lang==='es'?0:1];const small=document.createElement('small');small.textContent=completed?(lang==='es'?'Todas las habilidades del plan están completadas.':'All skills in this plan are completed.'):texts.desc;label.append(strong,small);const meta=document.createElement('span');meta.className='step-meta';const pill=document.createElement('span');pill.className='pill omega';pill.textContent=type==='pi'?'OMEGA':p.clone==='Omega*'?'OMEGA / ALPHA':'OMEGA';meta.append(pill);if(personalized){const prog=document.createElement('span');prog.className='pill done';prog.textContent=completed?(lang==='es'?'✓ PLAN COMPLETADO · 100 %':'✓ PLAN COMPLETE · 100%'):Math.round(s.done/s.all.length*100)+'%';meta.append(prog);}const chev=document.createElement('span');chev.className='chev';sum.append(num,label,meta,chev);d.append(sum);const content=document.createElement('div');content.className='content';const intro=document.createElement('p');intro.textContent=texts.intro;content.append(intro);if(type==='pi'){const notice=document.createElement('div');notice.className='alert';notice.textContent=T('omegaBody');content.append(notice);}else if(p.alpha){const notice=document.createElement('div');notice.className='alert';notice.textContent=T('alphaNote');content.append(notice);}if(personalized){const pg=document.createElement('div');pg.className='progressline';const st=document.createElement('span');st.textContent=T('progress');const val=document.createElement('b');val.textContent=`${s.done}/${s.all.length} ${T('complete')}`;pg.append(st,val);const bar=document.createElement('div');bar.className='progressbar';const fill=document.createElement('i');fill.style.width=(100*s.done/s.all.length)+'%';bar.append(fill);content.append(pg,bar);}content.append(buildStats(p,s.all,s.remaining,clone));const grid=document.createElement('div');grid.className='content-grid';const box=document.createElement('div');box.className='copybox';const cap=document.createElement('div');cap.className='plan-name-row';const capName=document.createElement('span');const capTitle=document.createElement('small');capTitle.textContent=T('copyTitle');const capB=document.createElement('strong');capB.textContent=titles[type][i][0];capName.append(capTitle,capB);const nameB=makeButton(T('copyName'),'copy alt');nameB.addEventListener('click',()=>copyToClipboard(titles[type][i][0],nameB));cap.append(capName,nameB);const boxHead=document.createElement('div');boxHead.className='boxhead';const headB=document.createElement('b');headB.textContent=personalized?T('copyPending'):T('copyPlan');const actions=document.createElement('span');actions.className='copy-actions';const copyPlan=makeButton(personalized?T('copyPending'):T('copyPlan'));copyPlan.disabled=personalized&&!s.remaining.length;copyPlan.addEventListener('click',()=>copyToClipboard(s.remaining.map(x=>x.line).join('\n'),copyPlan));actions.append(copyPlan);if(p.alpha){const aSkills=parsedLines(p.alpha),aSP=aSkills.reduce((sum,skill)=>sum+(spNeeded(skill)||0),0);const aMins=aSP/15;const alpha=makeButton(T('copyAlpha')+' · '+formatDuration(aMins),'copy alt');alpha.title=T('alphaTime')+': '+formatDuration(aMins);alpha.addEventListener('click',()=>copyToClipboard(p.alpha,alpha));actions.append(alpha);}boxHead.append(headB,actions);const pre=document.createElement('pre');pre.className='skills-text';pre.textContent=s.remaining.length?s.remaining.map(x=>x.line).join('\n'):T('planComplete');box.append(cap,boxHead,pre);const notes=document.createElement('div');notes.className='notes';const nb=document.createElement('b');nb.textContent=T('tips');const ul=document.createElement('ul');texts.notes.forEach(note=>{const li=document.createElement('li');li.textContent=note;ul.append(li);});const alert=document.createElement('div');alert.className='alert';alert.textContent=T('notice');notes.append(nb,ul,alert);grid.append(box,notes);content.append(grid);
const books=document.createElement('section');books.className='books-panel';const bkTop=document.createElement('div');bkTop.className='book-intro';const left=document.createElement('div');const bkTitle=document.createElement('h3');bkTitle.className='stack-title';bkTitle.textContent=T('skillbookTitle');const psub=document.createElement('p');psub.textContent=T('skillbookSub');left.append(bkTitle,psub);const badge=document.createElement('span');badge.className='pill';badge.textContent=apiState==='ready'&&!apiFailed?T('market'):T('marketReference');bkTop.append(left,badge);books.append(bkTop);const bkGrid=document.createElement('div');bkGrid.className='book-items';const seen=new Set();s.all.forEach(sk=>{if(seen.has(sk.name))return;seen.add(sk.name);bkGrid.append(bookCard(sk));});books.append(bkGrid);content.append(books);
const section=document.createElement('section');section.className='detail-panel';const sectitle=document.createElement('h3');sectitle.className='stack-title';sectitle.textContent=T('detailTitle');const help=document.createElement('p');help.className='muted';help.style.fontSize='12px';help.textContent=T('detailSub');const list=document.createElement('div');list.className='skill-list';s.all.forEach(sk=>list.append(renderSkillRow(sk)));section.append(sectitle,help,list);content.append(section);d.append(content);return d;}
let lastRenderedType='';
function render(){
 const openPlans=lastRenderedType===current?[...$('steps').children].map((x,i)=>x.open?i:-1).filter(i=>i>=0):[];
 updateText();document.querySelectorAll('[data-tab]').forEach(x=>{const sel=x.dataset.tab===current;x.classList.toggle('active',sel);x.setAttribute('aria-pressed',String(sel));});
 const cards=(current==='core'?core:pi).map((p,i)=>renderPlan(p,i,current));openPlans.forEach(i=>{if(cards[i])cards[i].open=true;});$('steps').replaceChildren(...cards);lastRenderedType=current;
 {const suggested=bestRemap((current==='core'?core:pi).flatMap(p=>planState(p).remaining)); const top=suggested?Object.entries(suggested.attrs).filter(([,v])=>v>17).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([id,v])=>attributeNames[id][lang==='es'?0:1].slice(0,3).toUpperCase()+' '+v).join(' / '):'—'; $('remapPill').textContent=activeProfile==='balanced'?'20 / 20':top;}
}
const esiBase='https://esi.evetech.net/latest';const groupESI=10000002,stationJita=60003760;let refreshSeq=0,pausedUntil=0;const PRICE_PAGES=4;
async function esiJSON(path,options){if(Date.now()<pausedUntil)throw new Error('Market temporarily unavailable');const u=new URL(esiBase+path);u.searchParams.set('compatibility_date','2026-10-01');const response=await fetch(u.href,{mode:'cors',cache:'no-store',signal:AbortSignal.timeout(9000),...options});if(response.status===420||response.status===429){pausedUntil=Date.now()+60000;throw new Error('Market temporarily unavailable');}if(!response.ok)throw new Error('Market HTTP '+response.status);return response.json();}
async function resolveCatalog(){const resp=await esiJSON('/universe/ids/?datasource=tranquility',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(allNames)});const ids=new Map((resp.inventory_types||[]).map(x=>[x.name,x.id]));for(const name of allNames){const id=ids.get(name);if(id)catalog.set(name,{...(catalog.get(name)||{}),id});}return ids;}
async function resolveType(name){const id=catalog.get(name)?.id;if(!id)return;const payload=await esiJSON(`/universe/types/${id}/?datasource=tranquility`);const dogma=Object.fromEntries((payload.dogma_attributes||[]).map(x=>[x.attribute_id,x.value]));const previous=catalog.get(name)||{};const v={...previous,id,rank:dogma[275]||dogma[280]||previous.rank||knownRanks[name],primary:dogma[180]||previous.primary,secondary:dogma[181]||previous.secondary};catalog.set(name,v);}
async function resolveQuote(name){const id=catalog.get(name)?.id;if(!id)return;let candidates=[],page=1;while(page<=PRICE_PAGES){const u=`/markets/${groupESI}/orders/?datasource=tranquility&order_type=sell&type_id=${id}&page=${page}`;const orders=await esiJSON(u);candidates.push(...orders.filter(x=>x.location_id===stationJita&&x.is_buy_order===false&&Number.isFinite(x.price)).map(x=>x.price));if(orders.length<1000)break;page++;}quotes.set(name,candidates.length?Math.min(...candidates):null);}
function scheduleQueue(names,asyncFn,concurrency=4){let cursor=0;return Promise.all(Array.from({length:Math.min(concurrency,names.length)},async()=>{while(cursor<names.length){if(Date.now()<pausedUntil)return;const i=cursor++;try{await asyncFn(names[i]);}catch(e){apiFailed=true;}}}));}
async function loadESI(force=false){if(fetching||Date.now()<pausedUntil)return;fetching=true;apiFailed=false;apiState='loading';updateStatus();const nonce=++refreshSeq;try{if(allNames.some(name=>!catalog.get(name)?.id))await resolveCatalog();await scheduleQueue(allNames,async name=>{if(!force&&quotes.has(name))return;await resolveQuote(name);},3);if(nonce===refreshSeq){apiState='ready';render();}}catch(e){apiFailed=true;apiState='offline';render();}finally{fetching=false;updateStatus();}}
$('tryDemo').addEventListener('click',()=>{if(typeof pilotConnected==='boolean'&&pilotConnected)return;demo=!demo;render();});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.tab;render();}));$('timeProfile').addEventListener('change',e=>{activeProfile=e.target.value;render();});$('refreshPrices').addEventListener('click',()=>loadESI(true));render();loadESI();
